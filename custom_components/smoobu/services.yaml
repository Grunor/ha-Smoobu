refresh:

get_reservations:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: smoobu
    arrival_from:
      selector:
        date:
    arrival_to:
      selector:
        date:
    departure_from:
      selector:
        date:
    departure_to:
      selector:
        date:
    apartment_id:
      selector:
        number:
          min: 1
          max: 999999999
          mode: box
    show_cancellation:
      default: false
      selector:
        boolean:

get_reservation:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: smoobu
    reservation_id:
      required: true
      selector:
        number:
          min: 1
          max: 9999999999
          mode: box

get_messages:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: smoobu
    reservation_id:
      required: true
      selector:
        number:
          min: 1
          max: 9999999999
          mode: box
    only_related_to_guest:
      default: false
      selector:
        boolean:

send_message:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: smoobu
    reservation_id:
      required: true
      selector:
        number:
          min: 1
          max: 9999999999
          mode: box
    recipient:
      default: guest
      selector:
        select:
          translation_key: recipient
          options:
            - guest
            - host
    subject:
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    internal:
      default: false
      selector:
        boolean:

# --- Schreibende Aktionen (ab v1.9.0) -----------------------------------------
block_period:
  fields:
    config_entry_id: &entry
      selector:
        config_entry:
          integration: smoobu
    apartment_id: &apt
      selector:
        number:
          min: 1
          max: 9999999999
          mode: box
    start_date:
      required: true
      selector:
        date:
    end_date:
      required: true
      selector:
        date:
    notice:
      selector:
        text:
delete_reservation:
  fields:
    config_entry_id: *entry
    reservation_id:
      required: true
      selector:
        number:
          min: 1
          max: 9999999999
          mode: box
    allow_booking:
      default: false
      selector:
        boolean:
set_rates:
  fields:
    config_entry_id: *entry
    apartment_id: *apt
    start_date:
      required: true
      selector:
        date:
    end_date:
      required: true
      selector:
        date:
    price:
      selector:
        number:
          min: 1
          max: 10000
          step: 1
          mode: box
          unit_of_measurement: "€"
    min_stay:
      selector:
        number:
          min: 1
          max: 90
          mode: box
update_reservation:
  fields:
    config_entry_id: *entry
    reservation_id:
      required: true
      selector:
        number:
          min: 1
          max: 9999999999
          mode: box
    arrival_time:
      selector:
        time:
    departure_time:
      selector:
        time:
    notice:
      selector:
        text:
          multiline: true

# --- KI-Assistent (ab v1.10.0) -------------------------------------------------
assistant_suggest:
  fields:
    config_entry_id: *entry
    reservation_id:
      required: true
      selector:
        number:
          min: 1
          max: 9999999999
          mode: box
    anlass:
      default: antwort
      selector:
        select:
          options: [antwort, willkommen, anreise, abreise, bewertung]
    message:
      selector:
        text:
          multiline: true
    push:
      default: false
      selector:
        boolean:
assistant_import:
  fields:
    config_entry_id: *entry
    jahre:
      default: 2
      selector:
        number:
          min: 1
          max: 5
          mode: box
assistant_build_knowledge:
  fields:
    config_entry_id: *entry
