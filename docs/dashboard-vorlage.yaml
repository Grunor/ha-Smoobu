# Smoobu – Dashboard-Vorlage (ab v1.15.0)
# =============================================================================
# Zweck: Komplettes Smoobu-Dashboard mit 7 Seiten (Übersicht, Kalender,
# Buchungen, Finanzen, Statistik, Nachrichten, Assistent). So sehen die Seiten aus: docs/screenshots/
#
# Einrichtung
# 1. Einstellungen → Dashboards → „Dashboard hinzufügen“ → „Neues Dashboard von Grund auf“,
#    Titel z. B. „Ferienwohnung“, URL „dashboard-ferienwohnung“.
# 2. Dashboard öffnen → ✎ → ⋮ → „Raw-Konfigurationseditor“ → diesen Inhalt einfügen → Speichern.
# 3. Andere URL gewählt? „back_path: /dashboard-ferienwohnung/…“ anpassen (nur der Zurück-Pfeil;
#    die Navigation der Kopfleiste findet die Seiten selbst).
# 4. Übersicht: optional unter „entities“ eigene Entitäten als Chips eintragen (Heizung, Tür …).
#    Empfehlung: weglassen – die Chip-Zeile zeigt dann nur die Ereignisse von heute.
# 5. Optionen der Integration → KI-Assistent → „Dashboard-Seite für Bearbeiten“:
#    /<eure-dashboard-url>/smoobu-nachrichten
#
# Aufbau: Jede Seite ist eine „panel“-Ansicht (volle Breite) mit einem vertical-stack:
#   1. custom:smoobu-header-card – Seiten-Navigation, Wohnungsauswahl (ab 2 Wohnungen) und
#      Hell/Dunkel/System. Die Seitenpfade sind relativ zum Dashboard → die URL ist frei wählbar.
#      Optional Rücksprung vor den Reitern, z. B. zu einer eigenen Startseite:
#        home: { name: "Start", path: /dashboard-ferienwohnung/start }
#   2. die Smoobu-Karte(n)
# Die Unterseiten sind „subview“ (kein eigener Tab, Zurück-Pfeil zur Übersicht).
# Die Karten werden von der Integration automatisch geladen – keine Ressource nötig.
#
# Nur bestimmte Nutzer? Je Ansicht ergänzen:
#   visible:
#     - user: <Benutzer-ID>   # Einstellungen → Personen → Benutzer
# =============================================================================

title: Ferienwohnung
views:
  # --- Seite 1: Übersicht (Einstieg, normaler Tab) ---------------------------
  - title: Smoobu
    path: smoobu
    icon: mdi:home-city
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:smoobu-header-card
          # Status heute, Gäste, Belegung 6 Wochen, Kennzahlen, Anreisen, Lücken, Offenes
          - type: custom:smoobu-overview-card
            # Optional eigene HA-Entitäten als Chips (siehe Einrichtung, Punkt 4):
            # entities:
            #   - climate.ferienwohnung
            #   - binary_sensor.ferienwohnung_eingangstuer

  # --- Seite 2: Kalender (Monate mit Preisen, sperren, Preise setzen) -----------
  - title: Kalender
    path: smoobu-kalender
    icon: mdi:calendar-month
    type: panel
    subview: true
    back_path: /dashboard-ferienwohnung/smoobu
    cards:
      - type: vertical-stack
        cards:
          - type: custom:smoobu-header-card
          - type: custom:smoobu-timeline-card
            months: 12
            show_prices: true

  # --- Seite 3: Buchungsliste (Suche, Filter, CSV-Export) ---------------------
  - title: Buchungen
    path: smoobu-buchungen
    icon: mdi:book-open-variant
    type: panel
    subview: true
    back_path: /dashboard-ferienwohnung/smoobu
    cards:
      - type: vertical-stack
        cards:
          - type: custom:smoobu-header-card
          - type: custom:smoobu-bookings-card

  # --- Seite 4: Finanzen (Kanäle, Vergleich, Diagramm, Erkenntnisse) -----------
  - title: Finanzen
    path: smoobu-finanzen
    icon: mdi:finance
    type: panel
    subview: true
    back_path: /dashboard-ferienwohnung/smoobu
    cards:
      - type: vertical-stack
        cards:
          - type: custom:smoobu-header-card
          - type: custom:smoobu-analytics-card

  # --- Seite 5: Statistik (Baukasten, Prognose, Saison, Buchungszeitpunkt …) ----
  - title: Statistik
    path: smoobu-statistik
    icon: mdi:chart-box-outline
    type: panel
    subview: true
    back_path: /dashboard-ferienwohnung/smoobu
    cards:
      - type: vertical-stack
        cards:
          - type: custom:smoobu-header-card
          - type: custom:smoobu-stats-card
            # Optional: diese Benutzer starten ohne eigene Wahl in der vereinfachten Ansicht
            # simple_users: [Name oder Benutzer-ID]

  # --- Seite 6: Posteingang (Antwort offen, keine Antwort nötig, KI-Vorschlag) --
  - title: Nachrichten
    path: smoobu-nachrichten
    icon: mdi:message-text
    type: panel
    subview: true
    back_path: /dashboard-ferienwohnung/smoobu
    cards:
      - type: vertical-stack
        cards:
          - type: custom:smoobu-header-card
          - type: custom:smoobu-inbox-card

  # --- Seite 7: KI-Assistent (Wissensdatenbank, Vorschläge, Gelerntes) ----------
  # Funktioniert auch mit gesperrter KI (Wissen pflegen, Import); KI-Buttons sind dann ausgegraut.
  - title: Assistent
    path: smoobu-assistent
    icon: mdi:robot-happy
    type: panel
    subview: true
    back_path: /dashboard-ferienwohnung/smoobu
    cards:
      - type: vertical-stack
        cards:
          - type: custom:smoobu-header-card
          - type: custom:smoobu-assistant-card

  # --- Seite 8: Einstellungen (v1.18.0) -------------------------------------
  # Gleiche Werte wie der Options-Dialog. Ändern dürfen HA-Admins und die in der Option
  # „Einstellungen im Dashboard erlauben für“ gewählten Benutzer (Prüfung im Backend).
  # Die Kopfzeile zeigt den Reiter „Einstellungen“ (Zahnrad) automatisch, sobald diese Ansicht existiert.
  - title: Einstellungen
    path: smoobu-einstellungen
    icon: mdi:cog
    type: panel
    subview: true
    back_path: /dashboard-ferienwohnung/smoobu
    cards:
      - type: vertical-stack
        cards:
          - type: custom:smoobu-header-card
          - type: custom:smoobu-settings-card
